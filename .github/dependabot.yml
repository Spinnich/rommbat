version: 2
updates:
  - package-ecosystem: nuget
    directory: / # Central package management, so Directory.Packages.props
    schedule:
      interval: weekly
    labels:
      - dependencies
    # Minor and patch arrive as one PR, so a week's routine bumps are verified together
    # against one build rather than five stale branches. Major bumps stay ungrouped: they
    # are the ones that need reading on their own, and a runner or framework major can go
    # green while doing something quietly wrong.
    groups:
      nuget:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The guide's build, tools/docs/requirements.txt.
  - package-ecosystem: pip
    directory: /tools/docs
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      guide:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # MkDocs 2.0 drops the plugin and theme systems Material is built on, so a major
    # MkDocs bump is a decision about the guide's toolchain, not a routine update.
    ignore:
      - dependency-name: mkdocs
        update-types:
          - version-update:semver-major
