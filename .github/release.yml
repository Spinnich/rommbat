# Groups a release's generated notes by each merged PR's type label. A PR lands in the first
# category that matches, so a platform PR also labeled enhancement reads under Platforms.
# The label set, and who applies it, is in CONTRIBUTING.md.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Platforms
      labels:
        - platform
    - title: New features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
