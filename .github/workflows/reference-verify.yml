name: Verify reference data

# reference/verify.py re-derives every upstream number docs/PLAN.md quotes from the
# vendored files. A failure here means an upstream fact moved, or that someone
# hand-edited a vendored artifact. Either way the fix is to revisit docs/PLAN.md,
# not to update the expected number. See reference/README.md.
#
# The bundled platform map and BIOS manifest are derived from the same vendored files,
# so both are checked here too: nothing else would notice data/retrobat/platforms.json
# drifting from the generator that owns it, and a stale data/retrobat/bios.json fails only
# in the .NET suite, a long way from the refresh that caused it.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - reference/**
      - docs/PLAN.md
      - data/retrobat/platforms.json
      - data/retrobat/bios.json
      - tools/build-platform-map.py
      - tools/build-bios-manifest.py
      - .github/workflows/reference-verify.yml

permissions:
  contents: read

concurrency:
  group: reference-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify
        working-directory: reference
        run: python3 verify.py

      - name: Check the bundled platform map is what its generator emits
        run: python3 tools/build-platform-map.py --check

      - name: Check the bundled BIOS manifest is what its generator emits
        run: python3 tools/build-bios-manifest.py --check
