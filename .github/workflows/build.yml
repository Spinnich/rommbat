name: Build

# Compiles the solution and runs the unit suite. Windows is the target platform and
# the only one the tree is guaranteed to build on, since RomMBat publishes win-x64
# self-contained. The publish step is not run here; see release.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      # Two tests drive the real executables in real processes and skip themselves when
      # neither has been published: the interleaved-hook one, and the rule-4 boundary that
      # proves game-start and game-end start no background pass. Both were skipping here,
      # which made the most important assertion in the suite one CI never ran. Published to
      # the default location, which is where the tests look.
      - name: Publish the hook and the agent, so the process-level tests run
        run: |
          dotnet publish src/RomMBat.Hook -c Release -r win-x64 --self-contained -p:PublishSingleFile=true
          dotnet publish src/RomMBat.Agent -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

      # xunit.v3 runs on Microsoft.Testing.Platform, which global.json selects. Its
      # options are not VSTest's: --output Detailed replaces the console logger.
      - name: Test
        run: dotnet test --configuration Release --no-build --output Detailed

  # The self-contained publish is the shipped artefact, so a compile that succeeds but cannot
  # be published is not a green build. One file for the agent and the hook; the UI is the exe
  # plus its native libraries, because bundling those unpacks them outside the tree.
  publish-check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Publish agent
        run: >
          dotnet publish src/RomMBat.Agent
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish/agent

      - name: Publish UI
        run: >
          dotnet publish src/RomMBat.UI
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish/ui

      # The only project in the tree that is trimmed, and a trimming regression compiles
      # cleanly and fails here. Four copies of this are installed, one per ES event folder,
      # so its size is the reason it is trimmed and this is what keeps that honest.
      - name: Publish hook
        run: >
          dotnet publish src/RomMBat.Hook
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish/hook

      - name: Upload artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rommbat-win-x64
          path: publish/
          retention-days: 7
