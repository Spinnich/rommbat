name: Upstream watch

# Opens or updates one tracking issue per RomM or RetroBat version line above RomMBat's floor,
# so a prerelease gets scouted and a stable adopted within one release without anyone watching
# upstream. The issue is worked through /upstream and the version-adoption skill.

on:
  schedule:
    - cron: 17 6 * * *
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Open or update the tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/upstream_watch.py
