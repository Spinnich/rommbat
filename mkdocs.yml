# The end-user guide. Its pages live in wiki/ and publish to GitHub Pages through
# .github/workflows/guide.yml; docs/ is the developer layer and never builds here.
site_name: RomMBat
site_description: Sync a RomM library with a RetroBat install
site_url: https://spinnich.github.io/rommbat/
repo_url: https://github.com/Spinnich/rommbat
repo_name: Spinnich/rommbat
edit_uri: edit/main/wiki/
copyright: RomMBat is licensed under GPL-3.0

docs_dir: wiki
strict: true

# wiki/README.md is the note to contributors about the guide, and platforms/_template.md the
# page a newly certified system copies; neither is a page of it.
exclude_docs: |
  README.md
  platforms/_template.md

# platforms/index.md and reference/cli.md are generated by tests; see wiki/README.md.
nav:
  - Home: index.md
  - Getting started:
      - Requirements: getting-started/requirements.md
      - Install: getting-started/install.md
      - Pairing: getting-started/pairing.md
      - Your first sync: getting-started/first-sync.md
  - Using RomMBat:
      - The gamepad interface: using/gamepad-ui.md
      - Sync sets: using/sync-sets.md
      - Find a game: using/browse-and-install.md
      - Disk space: using/disk-budget.md
      - Artwork and game lists: using/media-and-gamelists.md
      - BIOS and firmware: using/bios.md
  - Saves and playtime:
      - How saves sync: saves/index.md
      - Conflicts: saves/conflicts.md
      - Save states: saves/states.md
      - Memory cards and folder saves: saves/memory-cards.md
      - Restoring saves and states: saves/restore.md
      - Playtime: saves/playtime.md
  - Platforms:
      - platforms/index.md
      - Nintendo Entertainment System: platforms/nes.md
      - Super Nintendo: platforms/snes.md
      - Nintendo 64: platforms/n64.md
      - Game Boy: platforms/gb.md
      - Game Boy Color: platforms/gbc.md
      - Game Boy Advance: platforms/gba.md
      - Master System: platforms/mastersystem.md
      - Mega Drive and Genesis: platforms/megadrive.md
      - PlayStation: platforms/psx.md
  - Reference:
      - Command line: reference/cli.md
      - Glossary: reference/glossary.md

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Under strict, each of these warnings fails the build, so a broken link or anchor
# inside the guide stops CI the way check.py stops one in docs/.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
